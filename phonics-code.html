<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 읽기 암호 풀기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --ink:#16213B; --muted:#56627C; --line:#CDD5E2;
  --cons:#24365F; --vow:#D9482F; --long:#B8336A; --dig:#0F8577; --team:#6B45C8;
  --silent:#F2B705; --silent-ink:#3B2E00; --word:#16213B;
  --good:#1B8A4B; --bad:#C93A3A; --focus:#2F6BFF;
  --en:"Lexend","Segoe UI",Arial,sans-serif;
  --ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1524; --surface:#172039; --ink:#E8EDF6; --muted:#9BA7C0; --line:#2A3656;
    --cons:#3B5596; --word:#2D3B63; --good:#3CC47A; --bad:#FF6B6B; --focus:#7FA4FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#172039; --ink:#E8EDF6; --muted:#9BA7C0; --line:#2A3656;
  --cons:#3B5596; --word:#2D3B63; --good:#3CC47A; --bad:#FF6B6B; --focus:#7FA4FF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ko);font-size:17px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding:16px 20px 60px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 0 18px;border-bottom:2px solid var(--line);margin-bottom:28px}
.brand{font-family:var(--en);font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand i{display:inline-grid;place-items:center;width:30px;height:32px;border-radius:7px;background:var(--vow);color:#fff;font-style:normal;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tg{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:500}
.tg[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}

/* tiles */
.tiles{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;transition:gap .45s ease}
.tiles.merged{gap:3px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0}
.tile .face{min-width:clamp(58px,14vw,100px);height:clamp(66px,16vw,112px);padding:0 12px;border-radius:14px;display:grid;place-items:center;font-family:var(--en);font-weight:600;font-size:clamp(36px,9vw,66px);line-height:1;color:#fff;background:var(--cons);box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .2s ease, box-shadow .2s ease}
.tile.v .face{background:var(--vow)}
.tile.vl .face{background:var(--long)}
.tile.d .face{background:var(--dig)}
.tile.t .face{background:var(--team)}
.tile.s .face{background:var(--silent);color:var(--silent-ink)}
.tile.w .face{background:var(--word);font-size:clamp(28px,7vw,48px)}
.tile .hint{font-size:16px;font-weight:500;color:var(--muted);min-height:1.4em}
.tile.on .face{transform:translateY(-10px);box-shadow:0 15px 0 rgba(0,0,0,.18),0 0 0 4px var(--focus)}
.tile.changed .face{box-shadow:0 5px 0 rgba(0,0,0,.28),0 0 0 4px var(--silent)}
.nohint .tile .hint{visibility:hidden}
.nohint .snd{visibility:hidden}
.tile.sm .face{min-width:44px;height:52px;font-size:30px;border-radius:10px;padding:0 8px;box-shadow:0 4px 0 rgba(0,0,0,.25)}

/* buttons */
.btn{border:2px solid var(--ink);background:var(--surface);border-radius:10px;padding:11px 18px;font-weight:600;font-size:16px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 11px;font-family:var(--en);font-size:17px;font-weight:600}

/* home */
.hero{padding:10px 0 34px}
.hero h1{font-size:clamp(28px,6vw,44px);line-height:1.25;letter-spacing:-.02em;margin:0 0 12px;max-width:17em}
.lead{color:var(--muted);margin:0 0 30px;max-width:36em}
.demo{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:34px 16px 26px}
.demo .row{margin-top:26px}
.legend{display:flex;flex-wrap:wrap;gap:10px 22px;margin:0 0 36px;padding:0;list-style:none;font-size:15px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:8px}
.legend b{width:18px;height:18px;border-radius:5px;display:inline-block}
h2.sec{font-size:22px;margin:0 0 14px}
.levels{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lv{width:100%;display:flex;align-items:center;gap:16px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 18px}
.lv:hover{border-color:var(--ink)}
.num{flex:none;display:inline-grid;place-items:center;width:44px;height:48px;border-radius:10px;background:var(--cons);color:#fff;font-family:var(--en);font-weight:700;font-size:22px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.lvtext{flex:1;display:flex;flex-direction:column}
.lvtext strong{font-size:18px}
.lvtext span{color:var(--muted);font-size:15px;font-family:var(--en)}
.stars{font-size:20px;letter-spacing:2px;color:var(--silent);white-space:nowrap}
.stars .off{color:var(--line)}
.note{color:var(--muted);font-size:14px;margin-top:30px}

/* level */
.lvtitle{display:flex;align-items:center;gap:14px;font-size:clamp(24px,5vw,32px);margin:22px 0 8px}
.intro{color:var(--muted);margin:0 0 22px;max-width:40em}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:26px}
.tab{background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:10px 16px;font-weight:700;font-size:17px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--vow)}
.sub{display:flex;gap:8px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
.stage{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:34px 16px 28px;text-align:center}
.count{font-family:var(--en);color:var(--muted);align-self:center;min-width:64px;text-align:center}
.tip{color:var(--muted);font-size:15px;text-align:center;margin:18px auto 0;max-width:34em}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px;display:flex;gap:16px;align-items:flex-start}
.card .tile .face{min-width:74px;height:82px;font-size:44px}
.card .tile.w .face{font-size:30px;min-width:90px}
.cinfo{flex:1;min-width:0}
.cinfo p{margin:0 0 8px}
.ko{font-weight:700;font-size:18px}
.ko.tipline{font-weight:500;font-size:15px}
.hard{display:inline-block;background:var(--vow);color:#fff;font-size:12px;font-weight:700;border-radius:5px;padding:1px 7px;margin-right:4px;vertical-align:1px}
.ex{display:flex;flex-wrap:wrap;gap:6px}
.steps{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px 18px 18px 44px;margin:0 0 16px}
.steps li{margin:4px 0}
.steps code{font-family:var(--en);font-weight:600}
.predemo{margin-bottom:22px}

/* pairs */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:560px;margin:0 auto}
.pw{background:var(--bg);border:3px solid var(--line);border-radius:16px;padding:26px 10px;font-family:var(--en);font-weight:600;font-size:clamp(34px,8vw,56px)}
.pw.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--bg))}
.pw.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--bg))}
.msg{min-height:1.6em;font-weight:700;margin-top:14px}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}

/* ladder */
.trail{display:flex;flex-wrap:wrap;gap:6px 4px;justify-content:center;margin-bottom:26px;font-family:var(--en);color:var(--muted);font-size:17px}
.trail span.cur{color:var(--ink);font-weight:700}
.trail em{font-style:normal;opacity:.6}

/* magic */
.mpair{font-family:var(--en);font-size:22px;color:var(--muted);margin-bottom:24px}
.mpair b{color:var(--ink)}

/* flash */
.meaning{font-size:22px;font-weight:700;min-height:1.5em;margin-top:18px}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted);font-family:var(--en)}
.bar-prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:24px}
.bar-prog i{display:block;height:100%;background:var(--vow);transition:width .3s}
.qprompt{font-family:var(--en);font-weight:600;font-size:clamp(40px,10vw,64px);letter-spacing:.12em;margin:18px 0 6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:24px auto 0}
.opt{border:3px solid var(--line);background:var(--bg);border-radius:14px;padding:18px 8px;font-family:var(--en);font-weight:600;font-size:clamp(26px,6vw,38px)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--bg))}
.opt:disabled{cursor:default}
.result{font-size:clamp(40px,10vw,64px);color:var(--silent);letter-spacing:6px}
.result .off{color:var(--line)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-size:15px;max-width:90vw;z-index:10}
@media (max-width:520px){
  .card{flex-direction:column}
  .tab{padding:10px 10px;font-size:16px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <button class="brand" data-act="home" aria-label="처음 화면으로"><i>a</i>파닉스 코드</button>
    <div class="toggles">
      <button class="tg" id="tgHint" data-act="hint" aria-pressed="true">한글 힌트</button>
      <button class="tg" id="tgSlow" data-act="slow" aria-pressed="false">천천히 듣기</button>
    </div>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- storage ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let stars=store.get("phx-stars2",{});
let showHint=store.get("phx-hint",true);
let slowMode=store.get("phx-slow",false);

/* ---------- speech ---------- */
let voice=null;
const hasTTS='speechSynthesis' in window;
function pickVoice(){
  if(!hasTTS)return;
  const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Google|Samantha|Aria|Jenny|Allison/i.test(v.name))
     ||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text,rate){
  if(!hasTTS){toast("이 기기에서는 소리 재생이 지원되지 않아요. 다른 브라우저(크롬, 사파리)로 열어 주세요.");return Promise.resolve();}
  return new Promise(res=>{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; if(voice)u.voice=voice;
    u.rate=rate||(slowMode?0.6:0.85);
    let done=false; const fin=()=>{if(!done){done=true;res();}};
    u.onend=fin; u.onerror=fin;
    setTimeout(()=>speechSynthesis.speak(u),40);
    setTimeout(fin,4500);
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3500);}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- graphemes ---------- */
const HINT={a:"애",e:"에",i:"이",o:"아",u:"어",
  A:"에이",E:"이-",I:"아이",O:"오우",U:"유",
  b:"ㅂ",c:"ㅋ",d:"ㄷ",f:"f",g:"ㄱ",h:"ㅎ",j:"ㅈ",k:"ㅋ",l:"l",m:"ㅁ",n:"ㄴ",p:"ㅍ",r:"r",s:"ㅅ",t:"ㅌ",v:"v",w:"우",x:"ks",y:"이",z:"z",
  sh:"쉬",ch:"취",th:"th",ck:"ㅋ",ng:"응",
  ee:"이-",ea:"이-",ai:"에이",ay:"에이",oa:"오우",oo:"우-"};
const TEAMS=["ee","ea","ai","ay","oa","oo"];
function parse(w){
  return w.split("|").map(t=>{
    if(t.endsWith("^")){const g=t.slice(0,-1);return{g,type:"vl",hint:HINT[g.toUpperCase()]};}
    if(t.endsWith("!")){const g=t.slice(0,-1);return{g,type:"s",hint:"소리 X"};}
    const type="aeiou".includes(t)?"v":TEAMS.includes(t)?"t":t.length>1?"d":"c";
    return{g:t,type,hint:HINT[t]||""};
  });
}
const plain=w=>w.replace(/[|^!]/g,"");
function tilesHTML(w,o={}){
  const ps=parse(w);
  return `<div class="tiles${o.merged?" merged":""}"${o.id?` id="${o.id}"`:""}>`+
    ps.map((p,i)=>`<button type="button" class="tile ${p.type}${o.sm?" sm":""}${o.changed&&o.changed.includes(i)?" changed":""}" aria-label="${p.g}"><span class="face">${p.g}</span>${o.sm?"":`<span class="hint">${p.hint}</span>`}</button>`).join("")+`</div>`;
}

/* ---------- content ---------- */
const LEVELS=[
{n:1,title:"알파벳 26개 소리",sub:"a부터 z까지 첫소리",quizWhat:"첫 글자를",
 intro:"B는 ‘비’가 아니라 입술을 붙였다 터뜨리는 소리예요. 26개 글자마다 이름과 다른 ‘소리’가 있어요. 타일을 누르면 그 소리로 시작하는 단어 3개를 천천히 들려줘요. 빨간 타일은 모음, 남색 타일은 자음이에요.",
 learn:[
  ["a","짧은 ‘애’. 입을 옆으로 크게 벌려요.",["apple","ant","add"]],
  ["b","입술을 붙였다가 터뜨려요. 목이 울려요.",["bat","bus","bed"]],
  ["c","대부분 k와 같은 소리예요.",["cat","cup","cap"]],
  ["d","혀끝을 윗잇몸에 댔다가 떼요.",["dog","dig","duck"]],
  ["e","짧은 ‘에’. 입을 살짝만 벌려요.",["egg","end","elf"]],
  ["f","윗니를 아랫입술에 대고 바람만 내보내요. ㅍ과 달라요.",["fan","fit","fun"],1],
  ["g","목 안쪽에서 터지는 소리예요.",["get","gum","gap"]],
  ["h","숨을 내쉬듯 가볍게 내요.",["hat","hot","hug"]],
  ["i","짧은 ‘이’. 힘을 빼고 짧게 내요.",["ink","it","in"]],
  ["j","입술을 살짝 내밀고 ‘즈’ 하고 터뜨려요.",["jam","job","jet"]],
  ["k","c와 같은 소리예요.",["kid","kit","king"]],
  ["l","혀끝을 윗니 뒤에 딱 붙였다 떼요.",["leg","lip","lot"],1],
  ["m","입술을 다물고 콧소리를 내요.",["map","man","mom"]],
  ["n","혀끝을 윗잇몸에 대고 콧소리를 내요.",["net","nut","nap"]],
  ["o","짧은 ‘아’. 입을 세로로 크게 벌려요.",["octopus","on","ox"]],
  ["p","입술을 붙였다가 바람과 함께 터뜨려요.",["pen","pig","pop"]],
  ["q","항상 u와 함께 와서 qu = ‘크우’로 읽어요.",["queen","quiz","quick"]],
  ["r","혀를 뒤로 말고, 입천장에 닿지 않게 해요.",["red","run","rip"],1],
  ["s","‘쓰-’ 하는 바람 소리예요.",["sun","sit","six"]],
  ["t","혀끝을 윗잇몸에 댔다가 세게 떼요.",["top","ten","tub"]],
  ["u","짧은 ‘어’. 입에 힘을 빼고 가볍게 내요.",["up","us","umbrella"]],
  ["v","f와 입 모양이 같고, 목이 떨리게 내요. ㅂ과 달라요.",["van","vet","vest"],1],
  ["w","입술을 동그랗게 모았다가 풀어요.",["web","wet","win"]],
  ["x","보통 단어 끝에서 ‘ㅋㅅ’로 읽어요.",["box","fox","six"]],
  ["y","단어 앞에서 ‘이’처럼 미끄러지듯 내요.",["yes","yet","yak"]],
  ["z","s와 입 모양이 같고, 목이 떨리는 ‘즈-’ 소리예요.",["zoo","zip","zap"],1]
 ].map(([g,tip,ex,hard])=>({g,type:"aeiou".includes(g)?"v":"c",ko:HINT[g]||"크우",tipko:tip,hard:!!hard,key:ex[0],ex:ex.slice(1),say:ex.join(". ")+"."})),
 practice:[{kind:"pairs",pairs:[["fan","pan"],["fit","pit"],["van","ban"],["vet","bet"],["red","led"],["rip","lip"],["zip","sip"],["zoo","sue"],["jam","yam"],["den","ten"]]}],
 quizGen(){
  const ws=["bat","cat","dog","fan","gum","hat","jam","kid","leg","map","net","pen","red","sun","top","van","web","yes","zip","lip","fit","vet","rip","zoo","ant","egg","ink","ox","up"];
  const conf={b:"pvd",p:"bft",f:"pvh",v:"bfw",r:"lwn",l:"rnd",s:"zth",z:"sjd",d:"tbg",t:"dpk",g:"kdj",k:"gtd",c:"gtd",m:"nbp",n:"mld",h:"fsk",j:"yzg",y:"jwl",w:"vry",a:"eiu",e:"aiu",i:"eau",o:"uae",u:"oae"};
  return ws.map(w=>{const ans=w[0];const pool=(conf[ans]||"bdgkmnpst").split("").filter(x=>x!==ans);
    return{say:w,prompt:`_ ${w.slice(1).split("").join(" ")}`,opts:shuffle([ans,...shuffle(pool).slice(0,3)]),ans,show:w};});
 }},
{n:2,title:"모음 소리 익히기",sub:"a e i o u의 진짜 소리",quizWhat:"모음을",
 intro:"A는 ‘에이’가 아니라 ‘애’. 알파벳 이름과 소리는 달라요. 모음 5개의 짧은 소리를 익혀요.",
 learn:[
  {g:"a",type:"v",ko:"애",key:"apple",ex:["cat","map","bag"]},
  {g:"e",type:"v",ko:"에",key:"egg",ex:["bed","pen","red"]},
  {g:"i",type:"v",ko:"이",key:"ink",ex:["sit","pig","win"]},
  {g:"o",type:"v",ko:"아",key:"octopus",ex:["hot","dog","box"]},
  {g:"u",type:"v",ko:"어",key:"up",ex:["bus","cup","sun"]}
 ],
 practice:[{kind:"pairs",pairs:[["bad","bed"],["pen","pan"],["hot","hat"],["cup","cap"],["sit","set"],["big","bag"],["bus","boss"],["pin","pen"]]}],
 quizGen(){
  const ws=["c|a|t","m|a|p","b|a|g","b|e|d","p|e|n","r|e|d","s|i|t","p|i|g","w|i|n","h|o|t","d|o|g","b|o|x","b|u|s","c|u|p","s|u|n"];
  return ws.map(w=>{const p=w.split("|");const ans=p[1];
    const others=shuffle("aeiou".split("").filter(v=>v!==ans)).slice(0,3);

/* ---------- state ---------- */
const S={screen:"home",lv:1,tab:"learn",pk:0,

function nav(prev,next,i,n){return `<div class="row"><button class="btn ghost" data-act="${prev}" ${i===0?"disabled":""}>이전</button><span class="count">${i+1} / ${n}</span><button class="btn ghost" data-act="${next}" ${i===n-1?"disabled":""}>다음</button></div>`;}

function rBlend(p,el){
  const w=p.words[S.bi];
  el.innerHTML=`<div id="bt">${tilesHTML(w)}</div>
   <div class="row"><button class="btn primary" data-act="blend" data-w="${w}" data-t="bt">하나씩 읽고 이어 붙이기</button>

}
function rLadder(p,el){
  const set=p.sets[S.lad.set],st=S.lad.step,w=set[st];
  let changed=[];
  if(st>0){const a=parse(set[st-1]),b=parse(w);b.forEach((x,i)=>{if(!a[i]||a[i].g!==x.g)changed.push(i);});}
  el.innerHTML=`<div class="trail">${set.map((x,i)=>i<=st?`<span class="${i===st?"cur":""}">${plain(x)}</span>${i<set.length-1?"<em>›</em>":""}`:"").join("")}</div>
   ${tilesHTML(w,{changed})}
   <div class="row">
     <button class="btn primary" data-act="lnext" ${st===set.length-1?"disabled":""}>한 글자 바꾸기</button>
     <button class="btn" data-say="${plain(w)}">듣기</button>
     <button class="btn ghost" data-act="lnew">${p.sets.length>1?"다른 사다리":"처음부터"}</button></div>
   <p class="tip">${st===set.length-1?"사다리 끝까지 왔어요! 처음부터 한 번 더 빠르게 읽어 보세요.":"노란 테두리가 바뀐 글자예요. 누르기 전에 다음 단어를 먼저 읽어 보세요."}</p>`;
}
function rMagic(p,el){
  const [a,b]=p.pairs[S.mi],w=S.mOn?b:a;

   ${tilesHTML(w,{changed:S.mOn?[1]:[]})}

}
function rPairs(p,el){
  const pr=p.pairs[S.pi];

/* ---------- quiz ---------- */
function makeQuiz(){
  const L=cur();
  const pool=L.quizGen?L.quizGen():L.quiz.map(q=>({say:q[0],opts:shuffle(q),ans:q[0],show:q[0]}));
  return{items:shuffle(pool).slice(0,8),i:0,score:0,picked:null,done:false};
}
function rQuiz(P){
  const L=cur(),Q=S.quiz;
  if(!Q){
    const s=stars[L.n]||0;
    P.innerHTML=`<div class="stage"><p class="result">${starStr(s)}</p>
      <p>문제 8개. 소리를 듣고 알맞은 ${L.quizWhat||"단어를"} 고르세요.</p>
      <div class="row"><button class="btn primary" data-act="qstart">퀴즈 시작</button></div></div>`;return;
  }
  if(Q.done){
    const n=Q.items.length,sc=Q.score,st=sc>=7?3:sc>=5?2:sc>=3?1:0;
    P.innerHTML=`<div class="stage"><p class="result">${starStr(st)}</p>
      <p style="font-size:22px;font-weight:700">${n}문제 중 ${sc}개 정답</p>
      <p class="tip">${st===3?"완벽해요! 다음 단계로 넘어가도 좋아요.":st===2?"잘했어요. 틀린 소리만 연습 탭에서 한 번 더 들어 보세요.":"연습 탭에서 소리를 더 들어 보고 다시 도전해요."}</p>
      <div class="row"><button class="btn" data-act="qstart">다시 풀기</button>${L.n<LEVELS.length?`<button class="btn primary" data-act="open" data-n="${L.n+1}">다음 단계</button>`:""}</div></div>`;return;
  }
  const q=Q.items[Q.i],n=Q.items.length;
  P.innerHTML=`<div class="qtop"><span>${Q.i+1} / ${n}</span><span>정답 ${Q.score}</span></div>
   <div class="bar-prog"><i style="width:${(Q.i/n)*100}%"></i></div>
   <div class="stage">
    <div class="row" style="margin-top:0"><button class="btn primary" data-say="${q.say}">▶ 다시 듣기</button><button class="btn" data-act="qslow">천천히</button></div>
    ${q.prompt?`<p class="qprompt">${q.prompt}</p>`:""}
    <div class="opts">${q.opts.map(o=>{
      let c="";if(Q.picked!==null){if(o===q.ans)c="right";else if(o===Q.picked)c="wrong";}
      return `<button class="opt ${c}" data-act="qpick" data-o="${o}" ${Q.picked!==null?"disabled":""}>${o}</button>`}).join("")}</div>
    <p class="msg ${Q.picked===null?"":Q.picked===q.ans?"good":"bad"}">${Q.picked===null?"":Q.picked===q.ans?"정답이에요!":`정답은 ${q.ans}${q.prompt?" ("+q.show+")":""}`}</p>
    ${Q.picked!==null?`<div class="row" style="margin-top:6px"><button class="btn primary" data-act="qnext">${Q.i===n-1?"결과 보기":"다음 문제"}</button></div>`:""}
   </div>`;
}

/* ---------- blending animation ---------- */
let blending=false;
async function blend(target,w){
  if(blending)return;blending=true;
  const box=document.getElementById(target);
  box.innerHTML=tilesHTML(w);
  const row=box.querySelector(".tiles"),ts=[...row.querySelectorAll(".tile")];
  for(const t of ts){t.classList.add("on");await wait(slowMode?1100:750);t.classList.remove("on");}
  row.classList.add("merged");
  await wait(350);
  await speak(plain(w),0.55);
  await wait(250);
  await speak(plain(w));
  blending=false;
}
function flashTile(t){t.classList.add("on");setTimeout(()=>t.classList.remove("on"),450);}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act],[data-say],.tile");if(!b)return;
  if(b.classList.contains("tile"))flashTile(b);
  if(b.dataset.say){speak(b.dataset.say);return;}
  if(b.dataset.act)act(b.dataset.act,b);
});
function act(a,b){
  const L=cur(),p=L&&L.practice[Math.min(S.pk,L.practice.length-1)];
  switch(a){
    case"home":S.screen="home";render();scrollTo(0,0);break;
    case"open":S.screen="level";S.lv=+b.dataset.n;S.tab="learn";S.pk=0;S.bi=0;S.mi=0;S.mOn=false;S.pi=0;S.pTarget=null;S.fi=0;S.fShow=false;S.lad={set:0,step:0};S.quiz=null;render();scrollTo(0,0);break;
    case"tab":S.tab=b.dataset.k;if(S.tab==="quiz"&&S.quiz&&S.quiz.done)S.quiz=null;renderLevel();break;
    case"hint":showHint=!showHint;store.set("phx-hint",showHint);render();break;
    case"slow":slowMode=!slowMode;store.set("phx-slow",slowMode);render();break;
    case"blend":blend(b.dataset.t,b.dataset.w);break;
    case"pk":S.pk=+b.dataset.i;renderPanel();break;
    case"bprev":S.bi=Math.max(0,S.bi-1);renderPanel();break;
    case"bnext":S.bi=Math.min(p.words.length-1,S.bi+1);renderPanel();break;
    case"lnext":S.lad.step++;renderPanel();speak(plain(p.sets[S.lad.set][S.lad.step]));break;
    case"lnew":S.lad={set:(S.lad.set+1)%p.sets.length,step:0};renderPanel();break;
    case"mtoggle":S.mOn=!S.mOn;renderPanel();speak(plain(p.pairs[S.mi][S.mOn?1:0]));break;
    case"mprev":S.mi=Math.max(0,S.mi-1);S.mOn=false;renderPanel();break;
    case"mnext":S.mi=Math.min(p.pairs.length-1,S.mi+1);S.mOn=false;renderPanel();break;
    case"pprev":S.pi=Math.max(0,S.pi-1);S.pTarget=null;renderPanel();break;
    case"pnext":S.pi=Math.min(p.pairs.length-1,S.pi+1);S.pTarget=null;renderPanel();break;
    case"ptest":{const pr=p.pairs[S.pi];S.pTarget=pr[Math.floor(Math.random()*2)];renderPanel();speak(S.pTarget);break;}
    case"pw":{
      const w=b.dataset.w;
      if(!S.pTarget){speak(w);break;}
      const ok=w===S.pTarget,m=document.getElementById("pmsg");
      document.querySelectorAll(".pw").forEach(x=>{x.classList.remove("right","wrong");if(x.dataset.w===S.pTarget)x.classList.add("right");else if(x===b)x.classList.add("wrong");});
      m.className="msg "+(ok?"good":"bad");m.textContent=ok?`정답! ${S.pTarget}였어요.`:`아쉬워요. 정답은 ${S.pTarget}예요.`;
      S.pTarget=null;
      break;}
    case"fshow":S.fShow=!S.fShow;renderPanel();break;
    case"fprev":S.fi=Math.max(0,S.fi-1);S.fShow=false;renderPanel();break;
    case"fnext":S.fi=Math.min(L.learn.length-1,S.fi+1);S.fShow=false;renderPanel();break;
    case"qstart":S.quiz=makeQuiz();renderPanel();speak(S.quiz.items[0].say);break;
    case"qslow":speak(S.quiz.items[S.quiz.i].say,0.5);break;
    case"qpick":{const Q=S.quiz,q=Q.items[Q.i];Q.picked=b.dataset.o;if(Q.picked===q.ans)Q.score++;renderPanel();break;}
    case"qnext":{const Q=S.quiz;
      if(Q.i===Q.items.length-1){Q.done=true;const sc=Q.score,st=sc>=7?3:sc>=5?2:sc>=3?1:0;if(st>(stars[L.n]||0)){stars[L.n]=st;store.set("phx-stars2",stars);}}
      else{Q.i++;Q.picked=null;}
      renderPanel();if(!Q.done)speak(Q.items[Q.i].say);break;}
  }
}
render();
</script>

</html>
